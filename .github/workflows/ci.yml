name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-and-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: AST syntax check
        run: |
          python3 - <<'PY'
          import ast
          import pathlib
          import sys

          errors = []
          files = list(pathlib.Path('.').rglob('*.py'))
          for path in files:
              try:
                  ast.parse(path.read_text())
              except SyntaxError as exc:
                  errors.append(f"{path}: {exc}")
          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print(f"Syntax OK: {len(files)} Python files")
          PY

      - name: Cross-check tool registry, compatibility shims, and categories
        run: |
          python3 - <<'PY'
          import ast
          import sys

          def tool_functions(paths):
              names = set()
              for path in paths:
                  tree = ast.parse(open(path).read())
                  for node in ast.walk(tree):
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                          for dec in node.decorator_list:
                              if isinstance(dec, ast.Name) and dec.id == "tool":
                                  names.add(node.name)
                              elif isinstance(dec, ast.Attribute) and dec.attr == "tool":
                                  names.add(node.name)
              return names

          def list_names(path, assignment):
              tree = ast.parse(open(path).read())
              for node in tree.body:
                  target = None
                  value = None
                  if isinstance(node, ast.Assign) and node.targets:
                      target = node.targets[0]
                      value = node.value
                  elif isinstance(node, ast.AnnAssign):
                      target = node.target
                      value = node.value
                  if isinstance(target, ast.Name) and target.id == assignment:
                      return [item.id for item in value.elts if isinstance(item, ast.Name)]
              return []

          def category_names(path):
              tree = ast.parse(open(path).read())
              for node in tree.body:
                  if isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name) and node.target.id == "CATEGORY_TOOL_NAMES":
                      result = []
                      for value in node.value.values:
                          result.extend(item.value for item in value.elts if isinstance(item, ast.Constant))
                      return result
              return []

          defined = tool_functions([
              'agent/tools.py',
              'agent/tools/__init__.py',
              'agent/extended_tools.py',
          ])
          registry = (
              list_names('agent/tools.py', 'ALL_TOOLS')
              + list_names('agent/extended_tools.py', 'EXTRA_TOOLS')
          )
          categorized = category_names('agent/tool_router.py')
          missing = sorted(set(categorized) - set(registry))
          undefined = sorted(set(registry) - defined)
          duplicate_registry = sorted(
              name for name in set(registry) if registry.count(name) > 1
          )
          duplicate_categories = sorted(
              name for name in set(categorized) if categorized.count(name) > 1
          )
          print(f"Registry: {len(registry)} unique={len(set(registry))}")
          print(f"Categories: {len(categorized)} unique={len(set(categorized))}")
          print(f"Category entries missing from registry: {missing}")
          print(f"Registry entries without @tool definitions/shims: {undefined}")
          print(f"Duplicate registry entries: {duplicate_registry}")
          print(f"Duplicate category entries: {duplicate_categories}")
          if missing or undefined or duplicate_registry or duplicate_categories:
              sys.exit(1)
          PY

  pytest-macos:
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run tests
        run: pytest -q
