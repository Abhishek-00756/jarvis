<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Jarvis</title>
<style>
  :root { --bg:#0b0d12; --panel:#12151c; --accent:#4fd1ff; --accent-dim:#2a6f8a; --text:#e6edf3; --text-dim:#8b98a5; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif; height:100vh; display:flex; flex-direction:column; align-items:center; }
  .orb-wrap { margin-top:40px; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .orb { width:120px; height:120px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#7fe6ff,var(--accent) 45%,var(--accent-dim) 100%); box-shadow:0 0 30px rgba(79,209,255,.35); transition:box-shadow .3s ease; }
  .orb.idle { animation:breathe 3.5s ease-in-out infinite; }
  .orb.thinking { animation:spin-pulse 1.1s linear infinite; box-shadow:0 0 45px rgba(79,209,255,.6); }
  .orb.speaking { animation:talk-pulse .5s ease-in-out infinite alternate; box-shadow:0 0 55px rgba(79,209,255,.75); }
  @keyframes breathe { 0%,100%{transform:scale(1);opacity:.9;} 50%{transform:scale(1.05);opacity:1;} }
  @keyframes spin-pulse { 0%{transform:rotate(0) scale(1);} 50%{transform:rotate(180deg) scale(1.08);} 100%{transform:rotate(360deg) scale(1);} }
  @keyframes talk-pulse { 0%{transform:scale(1);} 100%{transform:scale(1.12);} }
  .status-label { font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); }
  .chat { width:100%; max-width:640px; flex:1; overflow-y:auto; padding:24px 20px; display:flex; flex-direction:column; gap:14px; }
  .bubble { padding:10px 14px; border-radius:14px; max-width:80%; line-height:1.4; font-size:15px; animation:fade-in .25s ease; }
  .bubble.user { align-self:flex-end; background:#1f6feb33; border:1px solid #1f6feb55; }
  .bubble.assistant { align-self:flex-start; background:var(--panel); border:1px solid #ffffff12; }
  @keyframes fade-in { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
  .input-bar { width:100%; max-width:640px; padding:16px 20px 24px; display:flex; gap:10px; }
  .input-bar input { flex:1; background:var(--panel); border:1px solid #ffffff1a; border-radius:10px; padding:12px 14px; color:var(--text); font-size:15px; outline:none; }
  .input-bar input:focus { border-color:var(--accent-dim); }
  .input-bar button { background:var(--accent); border:none; border-radius:10px; padding:0 20px; font-weight:600; color:#05161c; cursor:pointer; }
  .input-bar button:disabled { opacity:.4; cursor:not-allowed; }
</style>
</head>
<body>
<div class="orb-wrap"><div class="orb idle" id="orb"></div><div class="status-label" id="status">idle</div></div>
<div class="chat" id="chat"></div>
<div class="input-bar"><input id="input" type="text" placeholder="Ask Jarvis something..." autocomplete="off" /><button id="send">Send</button></div>
<script>
const orb=document.getElementById("orb"),status=document.getElementById("status"),chat=document.getElementById("chat"),input=document.getElementById("input"),sendBtn=document.getElementById("send");
let history=[];
function setState(state){orb.className="orb "+state;status.textContent=state;}
function addBubble(role,text){const div=document.createElement("div");div.className="bubble "+role;div.textContent=text;chat.appendChild(div);chat.scrollTop=chat.scrollHeight;return div;}
function speak(text){if(!( "speechSynthesis" in window))return;const utter=new SpeechSynthesisUtterance(text);utter.rate=1;utter.onstart=()=>setState("speaking");utter.onend=()=>setState("idle");speechSynthesis.speak(utter);}
async function send(){const text=input.value.trim();if(!text)return;input.value="";sendBtn.disabled=true;addBubble("user",text);history.push({role:"user",content:text});setState("thinking");try{const res=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({history})});const data=await res.json();history=data.history;addBubble("assistant",data.reply);speak(data.reply);}catch(err){addBubble("assistant","Error reaching the agent: "+err);setState("idle");}finally{sendBtn.disabled=false;input.focus();}}
sendBtn.addEventListener("click",send);input.addEventListener("keydown",e=>{if(e.key==="Enter")send();});
async function loadHistory(){try{const res=await fetch("/history");const data=await res.json();if(data.history&&data.history.length){history=data.history;for(const m of history)addBubble(m.role==="user"?"user":"assistant",m.content);return;}}catch(err){}addBubble("assistant","Hi — I'm listening. Type something to get started.");}
loadHistory();
</script>
</body>
</html>
